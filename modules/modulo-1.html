<!-- ===================== MÓDULO 1: VISÃO GERAL ===================== -->
<section class="view ui-page ui-overview-page" id="view-faixas">
  <div class="overview-context panel">
    <div class="overview-context-main">
      <div>
        <div class="panel-kicker">Situação atual</div>
        <div class="overview-series-line">
          <strong id="overview-series">Série —</strong>
          <span class="overview-separator">·</span>
          <span id="overview-launches">0/7 lançamentos</span>
        </div>
        <div class="panel-hint" id="overview-last-date">Nenhum lançamento registrado na série atual.</div>
      </div>
      <button type="button" class="overview-primary-action" data-papel="administrador" onclick="mostrarView('lancar')">Novo lançamento</button>
    </div>
    <div class="overview-kpis" aria-label="Resumo operacional">
      <div class="overview-kpi"><span class="overview-kpi-value" id="overview-participants">0</span><span class="overview-kpi-label">Participantes</span></div>
      <div class="overview-kpi"><span class="overview-kpi-value" id="overview-faixas">0</span><span class="overview-kpi-label">Faixas</span></div>
      <div class="overview-kpi"><span class="overview-kpi-value" id="overview-days">0/7</span><span class="overview-kpi-label">Lançamentos</span></div>
      <div class="overview-kpi"><span class="overview-kpi-value" id="overview-series-number">1</span><span class="overview-kpi-label">Série atual</span></div>
    </div>
  </div>

  <div class="board" id="board-container"></div>
</section>
